# Local-only database credentials for the kind overlay
# (tesserix-k8s/charts/apps/dwellm8-api/values-local.yaml).
#
#   cp k8s/secrets.example.yaml k8s/secrets.yaml
#   kubectl apply -n dwellm8 -f k8s/secrets.yaml
#
# k8s/secrets.yaml is gitignored. Nothing real belongs in either file: in the
# cluster these come from GCP Secret Manager through an ExternalSecret, and
# locally they are a password you typed into a laptop's PostgreSQL. If you ever
# find yourself pasting a production credential here, that is the bug.
#
# Two secrets, not one, because the API holds two connections and they are
# deliberately different roles — dwellm8_api is the request path and is subject
# to row-level security, dwellm8_platform is the audited support path that the
# webhook inbox needs before it knows whose money a delivery concerns (ADR-0003).
# Collapsing them into one credential locally would hide every policy bug until
# production.
apiVersion: v1
kind: Secret
metadata:
  name: dwellm8-local-db
type: Opaque
stringData:
  username: dwellm8_api
  password: local
---
apiVersion: v1
kind: Secret
metadata:
  name: dwellm8-local-db-platform
type: Opaque
stringData:
  username: dwellm8_platform
  password: local
