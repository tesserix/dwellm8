name: api

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'services/api/**'
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    # A real PostgreSQL, because the isolation harness checks PostgreSQL's own
    # behaviour — FORCE row level security, and what an unset session variable
    # does. A mock would only assert that the mock works.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: bootstrap
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: services/api/go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The schema under test is the one that ships: the same file the cluster's
      # bootstrap job applies, fetched from tesserix-k8s rather than a copy that
      # can drift.
      - name: Load the dwellm8 schema
        env:
          PGPASSWORD: bootstrap
        run: |
          set -euo pipefail
          # Cache-busted, because raw.githubusercontent.com is a CDN with a
          # minutes-long TTL: a schema change pushed to tesserix-k8s and an app
          # change pushed straight after it race, and the loser is a run that
          # fails with "relation does not exist" against a schema that does.
          curl -fsSL -H 'Cache-Control: no-cache' -o /tmp/dwellm8.sql \
            "https://raw.githubusercontent.com/tesserix/tesserix-k8s/main/charts/apps/db-schema-bootstrap/schemas/dwellm8/dwellm8/dwellm8.sql?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          psql -h localhost -U postgres -c "CREATE ROLE dwellm8 LOGIN CREATEROLE PASSWORD 'ci'"
          psql -h localhost -U postgres -c "CREATE DATABASE dwellm8 OWNER dwellm8"
          PGPASSWORD=ci psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql
          PGPASSWORD=ci psql -h localhost -U dwellm8 -d dwellm8 \
            -c "ALTER ROLE dwellm8_api WITH PASSWORD 'ci'" \
            -c "ALTER ROLE dwellm8_platform WITH PASSWORD 'ci'" \
            -c "ALTER ROLE dwellm8_purge WITH PASSWORD 'ci'"

      # Includes internal/platform/arch — the ADR-0001 boundary tests — and the
      # ADR-0003 isolation harness, which needs both DSNs to run rather than skip.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: go test -race -count=1 ./...

      # The harness is only worth having if it fails. This plants a real
      # violation and expects a red build; a green one means the guard is gone.
      - name: Prove the isolation harness still bites
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -c "ALTER TABLE audit_events NO FORCE ROW LEVEL SECURITY"
          if go test -count=1 -run TestAuditEventsIsolation ./internal/platform/tenancy/isolationtest/; then
            echo "::error::the isolation harness passed with FORCE removed — the guard is not working"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -c "ALTER TABLE audit_events FORCE ROW LEVEL SECURITY"
          echo "the harness caught it, as it should"

      # The same treatment for ADR-0005. A grant that stops checking who its
      # grantee is turns every firm's grant into every other firm's, which is
      # precisely the failure nobody would notice from the outside.
      - name: Prove the delegation contract still bites
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE OR REPLACE FUNCTION is_delegated(row_tenant uuid, row_property uuid, required_permission text)
              RETURNS boolean LANGUAGE sql STABLE PARALLEL SAFE AS \$\$
              SELECT EXISTS (SELECT 1 FROM delegation_grants g
                              WHERE g.id = current_grant_id()
                                AND g.tenant_id = row_tenant
                                AND g.revoked_at IS NULL) \$\$"
          if go test -count=1 -run TestGrantModel ./internal/platform/tenancy/isolationtest/; then
            echo "::error::the delegation contract passed with the grantee and scope checks removed"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "the contract caught it, as it should"

      # And ADR-0009's half of it. This defect is the tempting one: it checks the
      # grant, the permission and the property, and would pass every assertion
      # ADR-0005 could write. What it stops checking is which unit — so a mandate
      # over one flat reads the whole tower, and nothing about the request looks
      # wrong. Measured locally: visible units [101 102 103 P-1 P-2], want
      # [101 102 P-1].
      - name: Prove the unit-scope check still bites
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE OR REPLACE FUNCTION is_delegated_unit(
                    row_tenant uuid, row_property uuid, row_unit uuid, row_parent_unit uuid,
                    required_permission text)
              RETURNS boolean LANGUAGE sql STABLE PARALLEL SAFE AS \$\$
              SELECT EXISTS (SELECT 1 FROM delegation_grant_scopes s
                              WHERE s.grant_id = current_active_grant(row_tenant, required_permission)
                                AND (s.scope_kind = 'portfolio'
                                  OR s.scope_property_id = row_property)) \$\$"
          if go test -count=1 -run TestPropertyScope ./internal/platform/tenancy/isolationtest/; then
            echo "::error::the property-scope contract passed with unit granularity removed — a one-unit mandate now reads every unit in the property"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "the contract caught it, as it should"

      # ADR-0006. Double entry is the one rule that cannot be a review comment:
      # an entry whose debits and credits differ is money that came from nowhere,
      # and it is invisible in every screen that shows a balance. This removes
      # the check and requires the ledger contract to go red.
      - name: Prove the ledger balance rule still bites
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE OR REPLACE FUNCTION ledger_entry_balances() RETURNS trigger
              LANGUAGE plpgsql AS \$\$ BEGIN RETURN NULL; END \$\$"
          if go test -count=1 -run TestLedger ./internal/platform/tenancy/isolationtest/; then
            echo "::error::the ledger contract passed with the balance check removed — an entry of 2500000 debits and 2000000 credits now commits"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "the contract caught it, as it should"

      # And ADR-0009's granularity lesson, applied to money. This defect passes
      # every assertion in the schema: the policy checks the grant, the
      # permission and the property, and simply stops checking the unit. A firm
      # managing one flat then reads the whole tower's rent roll. Measured
      # locally: visible postings [scope-granted scope-parking scope-sibling],
      # want [scope-granted scope-parking].
      - name: Prove the ledger's unit scope still bites
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            DROP POLICY ledger_postings_tenant_isolation ON ledger_postings;
            CREATE POLICY ledger_postings_tenant_isolation ON ledger_postings
              USING (tenant_id = current_tenant_id() OR is_platform_session()
                     OR (property_id IS NOT NULL AND is_delegated(tenant_id, property_id, 'money.read')))
              WITH CHECK (tenant_id = current_tenant_id() OR is_platform_session()
                     OR (property_id IS NOT NULL AND is_delegated(tenant_id, property_id, 'money.collect')));"
          if go test -count=1 -run TestLedger ./internal/platform/tenancy/isolationtest/; then
            echo "::error::the ledger contract passed with unit granularity removed — a one-flat mandate now reads the whole tower's money"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "the contract caught it, as it should"

      # The bootstrap assertions cannot be tested by replaying the file: the
      # replay re-creates the policy it is about to judge, repairing the defect
      # before the assertion runs. So the assertion block is extracted and run on
      # its own against a schema that has been broken underneath it.
      - name: Prove the bootstrap assertions still bite
        env:
          PGPASSWORD: ci
        run: |
          set -uo pipefail
          awk '/^-- tenancy assertions/{f=1} f' /tmp/dwellm8.sql > /tmp/assertions.sql

          # Assertion 6: units judged at property granularity rather than unit.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            DROP POLICY units_tenant_isolation ON units;
            CREATE POLICY units_tenant_isolation ON units
              USING (tenant_id = current_tenant_id() OR is_platform_session()
                     OR is_delegated(tenant_id, property_id, 'property.read'))
              WITH CHECK (tenant_id = current_tenant_id() OR is_platform_session()
                     OR is_delegated(tenant_id, property_id, 'property.write'));" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 6 accepted a units policy judged at property granularity"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # Assertion 5: a property-scoped table with no delegated branch at all.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            DROP POLICY blocks_tenant_isolation ON blocks;
            CREATE POLICY blocks_tenant_isolation ON blocks
              USING (tenant_id = current_tenant_id() OR is_platform_session())
              WITH CHECK (tenant_id = current_tenant_id() OR is_platform_session());" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 5 accepted a table with property_id and no delegated branch"
            exit 1
          fi
          # Assertion 7: the ledger made mutable. This one had to be fixed before
          # it worked — with the subquery alias named `cmd`, `p.cmd = cmd` binds
          # to pg_policies' own column and the check passes on either policy.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "DROP POLICY ledger_postings_no_update ON ledger_postings" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 7 accepted a ledger with no deny-update policy"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # Assertion 10: the balances view running as its owner instead of its
          # caller. It does not leak — it under-reports, which is worse.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "ALTER VIEW ledger_balances SET (security_invoker = false)" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 10 accepted a ledger_balances view that is not security_invoker"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # Assertion 11: the table owner inheriting dwellm8_platform, which
          # switches tenant isolation off for every session that connects as it
          # while every policy still reads correctly. ADR-0006 §7 — this was a
          # live defect, not a hypothetical one.
          PGPASSWORD=bootstrap psql -h localhost -U postgres -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "GRANT dwellm8_platform TO dwellm8 WITH INHERIT TRUE" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 11 accepted a table owner that inherits dwellm8_platform"
            exit 1
          fi
          PGPASSWORD=bootstrap psql -h localhost -U postgres -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "GRANT dwellm8_platform TO dwellm8 WITH INHERIT FALSE, ADMIN TRUE, SET FALSE" >/dev/null
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # Assertion 6 again, against ADR-0011's payments table. The assertion
          # was written for ADR-0009 and this table did not exist then; it is
          # column-driven, so it polices a table nobody updated it for. Worth
          # asserting rather than assuming — a guard that only covers the tables
          # its author had in mind is a guard that decays with every migration.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            DROP POLICY payments_tenant_isolation ON payments;
            CREATE POLICY payments_tenant_isolation ON payments
                USING (tenant_id = current_tenant_id() OR is_platform_session()
                       OR is_delegated(tenant_id, property_id, 'money.read'))
                WITH CHECK (tenant_id = current_tenant_id() OR is_platform_session()
                       OR is_delegated(tenant_id, property_id, 'money.collect'))" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 6 accepted a payments policy judged at property granularity"
            exit 1
          fi
          # Assertion 12, ADR-0012. The nullable-tenant table is no longer an
          # exception — it is a pattern with four members — so the guard is a
          # generalisation of ADR-0011 §5's paragraph. The defect is the plausible
          # one: give the table the ordinary ADR-0003 policy shape, which on a
          # table where tenant_id may be NULL constrains nothing at all.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            DROP POLICY settlement_lines_tenant_isolation ON settlement_lines;
            CREATE POLICY settlement_lines_tenant_isolation ON settlement_lines
              USING (is_platform_session() OR tenant_id = current_tenant_id())
              WITH CHECK (is_platform_session() OR tenant_id = current_tenant_id());" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 12 accepted a nullable-tenant table that an organisation may write"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # And the same assertion against ADR-0011's inbox, which was written
          # before assertion 12 existed. Measured: it names payment_events. The
          # mirror image of assertion 6 catching the payments table, and the reason
          # both are worth planting — a guard is only general if something proves it.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            DROP POLICY payment_events_tenant_isolation ON payment_events;
            CREATE POLICY payment_events_tenant_isolation ON payment_events
              USING (is_platform_session() OR tenant_id = current_tenant_id())
              WITH CHECK (is_platform_session() OR tenant_id = current_tenant_id());" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 12 did not cover payment_events — the guard only polices the tables its author had in mind"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # Assertion 10, now catalogue-driven rather than naming ledger_balances.
          # The ageing view under-reporting instead of leaking is the same failure
          # ADR-0006 §5 described, on a report whose whole job is to say what is
          # missing.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "ALTER VIEW settlement_drift_ageing SET (security_invoker = false)" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 10 accepted an ageing view that is not security_invoker — it was still named after ledger_balances"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # Assertion 13, ADR-0015. This one exists because of the trap the file's
          # migrations section is three entries long for: a CHECK written inside
          # CREATE TABLE IF NOT EXISTS is skipped on a database that already has the
          # table, so the file replays green with the constraint absent. Every
          # database CI builds is fresh, which is exactly why CI never saw it.
          #
          # Two plants, because the assertion covers both kinds: a CHECK and a
          # trigger.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE workflow_runs DROP CONSTRAINT workflow_runs_compensated_means_reversible" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 13 accepted a schema missing the constraint that stops a payout being recorded as compensated after the money left"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "DROP TRIGGER payments_forward_only ON payments" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 13 accepted a schema with no forward-only trigger on payments"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # Assertion 14, ADR-0008. Column-driven like assertion 6, so it polices a
          # table nobody updated it for — the second plant is a table invented here
          # and never mentioned in the schema, which is how ADR-0010's rent schedule
          # was covered before it existed.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            ALTER TABLE property_ownership DROP CONSTRAINT property_ownership_no_overlap_unit;
            ALTER TABLE property_ownership DROP CONSTRAINT property_ownership_no_overlap_property" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 14 accepted an effective-dated table with no exclusion constraint — two revisions of the same flat can both be current"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE TABLE assertion14_probe (id uuid PRIMARY KEY, tenant_id uuid NOT NULL,
              valid_from date NOT NULL, valid_to date)" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 14 did not notice a new effective-dated table — it only covers the tables its author had in mind"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "DROP TABLE assertion14_probe" >/dev/null

          # And the other half of the rule: an effective date modelled as a timestamp,
          # which is the plausible mistake because every other date column in the file
          # is a timestamptz.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE TABLE assertion14_tsprobe (id uuid PRIMARY KEY, tenant_id uuid NOT NULL,
              valid_from timestamptz NOT NULL, valid_to timestamptz)" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 14 accepted an effective date as a timestamp — 1 April then means two days five and a half hours apart"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "DROP TABLE assertion14_tsprobe" >/dev/null

          # Assertion 15, ADR-0013. Two clauses because they catch different developers:
          # a column named after the identifier (the careless case, and the common one),
          # and any column at all that ADR-0013 does not list (the case that does not
          # depend on guessing what somebody calls the field).
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE TABLE assertion15_probe (id uuid PRIMARY KEY, aadhaar_number text)" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 15 accepted a column named after a prohibited identifier"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "DROP TABLE assertion15_probe" >/dev/null

          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            ALTER TABLE kyc_verifications ADD COLUMN full_number text" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 15 accepted a thirteenth column on kyc_verifications — a field that would persist a full identifier is not blocked"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            ALTER TABLE kyc_verifications DROP COLUMN full_number" >/dev/null
          echo "the assertions caught all fifteen, as they should"

      # ADR-0013 §2. The mechanism, not the intention: the column will not take a full
      # identifier. Dropping the CHECK must make the isolation test go red, and the
      # cleanup afterwards matters — the planted test writes the rows the constraint
      # forbids, so the schema cannot be replayed over them.
      - name: Prove a full identifier cannot be stored
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE kyc_verifications DROP CONSTRAINT kyc_verifications_reference_is_a_mask"
          if go test -count=1 -run TestAFullIdentifierCannotBeWrittenByAnyPath \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::a full Aadhaar number was stored — this is the honeypot ADR-0013 exists to prevent"
            exit 1
          fi
          # The planted rows hold full identifiers, so ADD CONSTRAINT cannot validate over
          # them. The schema warns rather than aborting (see its load-bearing rules block)
          # and assertion 13 then fails, so the rows have to go before the replay.
          PGPASSWORD=bootstrap psql -h localhost -U postgres -d dwellm8 -v ON_ERROR_STOP=1 -c "
            ALTER TABLE kyc_verifications NO FORCE ROW LEVEL SECURITY;
            DELETE FROM kyc_access_log; DELETE FROM kyc_verifications;
            ALTER TABLE kyc_verifications FORCE ROW LEVEL SECURITY;" >/dev/null
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE kyc_access_log DROP CONSTRAINT kyc_access_log_support_needs_a_grant"
          if go test -count=1 -run TestASupportReadWithoutAGrantIsRefused \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::a support read with no grant behind it was recorded, so access is not time-bound"
            exit 1
          fi
          PGPASSWORD=bootstrap psql -h localhost -U postgres -d dwellm8 -v ON_ERROR_STOP=1 -c "
            ALTER TABLE kyc_access_log NO FORCE ROW LEVEL SECURITY;
            DELETE FROM kyc_access_log;
            ALTER TABLE kyc_access_log FORCE ROW LEVEL SECURITY;" >/dev/null
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "the KYC constraints caught both, as they should"

      # ADR-0013 §2's Go half. A field named after the identifier is a field that reaches
      # a log, and the SDK returning `aadhaarNumber` is how the name gets there.
      - name: Prove nothing can be named after a prohibited identifier
        run: |
          set -uo pipefail
          trap 'rm -f internal/money/domain/planted_pii.go' EXIT
          cat > internal/money/domain/planted_pii.go <<'GO'
          package domain

          type plantedKYC struct {
          	AadhaarNumber string `json:"aadhaar_number"`
          }
          GO
          if go test -count=1 -run TestNothingIsNamedAfterAProhibitedIdentifier ./internal/platform/arch/; then
            echo "::error::a struct field named after a prohibited identifier passed the guard"
            exit 1
          fi
          echo "the guard caught it, as it should"

      # ADR-0008 §4 and §6. Neither of these failures has an error in it at the time:
      # an overlap makes an as-of query silently return whichever row the planner
      # reached first, and an in-place edit makes the history say something that was
      # never true.
      - name: Prove effective dating still bites
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            ALTER TABLE property_ownership DROP CONSTRAINT property_ownership_no_overlap_unit"
          if go test -count=1 -run TestOwnershipAnswersAsOfAndRefusesOverlap \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::two ownership intervals overlapping the same day were accepted"
            exit 1
          fi
          # The planted test committed the overlapping row, and ADD CONSTRAINT
          # validates existing rows — same situation as the ADR-0015 guard, same fix.
          PGPASSWORD=bootstrap psql -h localhost -U postgres -d dwellm8 -v ON_ERROR_STOP=1 -c "
            ALTER TABLE property_ownership NO FORCE ROW LEVEL SECURITY;
            DELETE FROM property_ownership;
            ALTER TABLE property_ownership FORCE ROW LEVEL SECURITY;" >/dev/null
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "DROP TRIGGER property_ownership_no_edit ON property_ownership"
          if go test -count=1 -run TestOwnershipHistoryCannotBeEditedInPlace \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::ownership history was edited in place, so the record now says something that was never true"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "effective dating caught both, as it should"

      # ADR-0010. Four plants, and the interesting one is the second: it does not remove
      # the no-double-let constraint, it widens its scope to cover drafts. That reads as
      # a stricter constraint and is a product bug — an owner can no longer prepare a
      # renewal while the current tenancy runs — which is why the scope is compared
      # against State.Tenancy() state by state rather than merely asserted to exist.
      - name: Prove the lease lifecycle still bites
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          # Deleting the harness's leases now means deleting what references them.
          # journal_entries.lease_id is a foreign key as of ADR-0010 §7 — which is the
          # point of that change, and it is why this function grew: the Test step above
          # writes a lease_charge entry, so the leases cannot go until it does.
          #
          # Only the entries that name a lease, so nothing else the suite wrote is
          # touched. The balance triggers are AFTER INSERT, so a delete does not fire them.
          #
          # Payments go first, and cannot simply be detached: entry_id is a foreign key
          # and payments_captured_has_entry refuses to let a captured one give up its
          # entry. So the collection and its deliveries are deleted outright — they are
          # this suite's own rows, and #42 wired the capture to the ledger, which is what
          # put a payment in the way of this delete.
          clean() {
            PGPASSWORD=bootstrap psql -h localhost -U postgres -d dwellm8 -v ON_ERROR_STOP=1 -c "
              ALTER TABLE leases NO FORCE ROW LEVEL SECURITY;
              ALTER TABLE journal_entries NO FORCE ROW LEVEL SECURITY;
              ALTER TABLE ledger_postings NO FORCE ROW LEVEL SECURITY;
              ALTER TABLE payments NO FORCE ROW LEVEL SECURITY;
              ALTER TABLE payment_events NO FORCE ROW LEVEL SECURITY;
              DELETE FROM payment_events WHERE payment_id IN (
                SELECT id FROM payments WHERE lease_id IS NOT NULL
                   OR entry_id IN (SELECT id FROM journal_entries WHERE lease_id IS NOT NULL));
              DELETE FROM payments WHERE lease_id IS NOT NULL
                 OR entry_id IN (SELECT id FROM journal_entries WHERE lease_id IS NOT NULL);
              DELETE FROM ledger_postings
               WHERE entry_id IN (SELECT id FROM journal_entries WHERE lease_id IS NOT NULL);
              DELETE FROM journal_entries WHERE lease_id IS NOT NULL;
              ALTER TABLE lease_tax_facts NO FORCE ROW LEVEL SECURITY;
              ALTER TABLE tds_obligations NO FORCE ROW LEVEL SECURITY;
              ALTER TABLE tds_obligation_steps NO FORCE ROW LEVEL SECURITY;
              DELETE FROM rent_schedule; DELETE FROM lease_parties;
              -- Everything that names a lease goes before the lease does. Both of
              -- these reference it, and neither cascades on purpose: what was
              -- deducted and what the tenant declared are answers to a notice.
              DELETE FROM tds_obligation_steps; DELETE FROM tds_obligations;
              DELETE FROM lease_tax_facts; DELETE FROM leases;
              ALTER TABLE tds_obligation_steps FORCE ROW LEVEL SECURITY;
              ALTER TABLE tds_obligations FORCE ROW LEVEL SECURITY;
              ALTER TABLE lease_tax_facts FORCE ROW LEVEL SECURITY;
              ALTER TABLE payment_events FORCE ROW LEVEL SECURITY;
              ALTER TABLE payments FORCE ROW LEVEL SECURITY;
              ALTER TABLE ledger_postings FORCE ROW LEVEL SECURITY;
              ALTER TABLE journal_entries FORCE ROW LEVEL SECURITY;
              ALTER TABLE leases FORCE ROW LEVEL SECURITY;" >/dev/null
          }

          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE OR REPLACE FUNCTION lease_transition_allowed(from_state text, to_state text)
              RETURNS boolean LANGUAGE sql IMMUTABLE PARALLEL SAFE AS \$\$
              SELECT (from_state, to_state) IN (('draft','active'),('active','terminated')) \$\$"
          if go test -count=1 -run TestTheGoLeaseStateMachineMatchesTheDatabase ./internal/lease/store/; then
            echo "::error::the lease state machine drift check passed with the transition table narrowed"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # The scope widened to cover drafts. Planted on an empty table, because the
          # existing drafts would conflict and ADD CONSTRAINT would refuse — which is
          # the constraint doing its job and not what is being tested here.
          clean
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            ALTER TABLE leases DROP CONSTRAINT leases_no_double_let;
            ALTER TABLE leases ADD CONSTRAINT leases_no_double_let
              EXCLUDE USING gist (tenant_id WITH =, unit_id WITH =, validity WITH &&)
              WHERE (state IN ('draft','pending_signature','active','in_notice','renewed','terminated','settled'))"
          if go test -count=1 -run TestTheNoDoubleLetScopeMatchesTenancy ./internal/lease/store/; then
            echo "::error::the double-let scope check passed with drafts inside the constraint, so an owner cannot prepare a renewal"
            exit 1
          fi
          # Dropped first: the schema's ADD CONSTRAINT is guarded by IF NOT EXISTS, so a
          # constraint that exists with the wrong body is not corrected by a replay.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE leases DROP CONSTRAINT leases_no_double_let"
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE OR REPLACE FUNCTION leases_retrospective_end_needs_a_decision() RETURNS trigger
              LANGUAGE plpgsql AS \$\$ BEGIN RETURN NEW; END \$\$"
          if go test -count=1 -run TestARetrospectiveTerminationIsRefusedByAskingTheLedger \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::a termination leaving an over-billed period was accepted with no decision"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE leases DROP CONSTRAINT leases_no_double_let"
          if go test -count=1 -run TestAFlatCannotBeLetTwiceOverTheSameDays \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::one flat was let to two live tenancies over the same days"
            exit 1
          fi
          clean
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "the lifecycle caught all four, as it should"

      # ADR-0019. The first read path in this schema that does not fail closed, so the
      # guards are about how narrow it is. The second plant is the one that matters: a
      # policy reaching a publicly-readable table through a subquery inherits its
      # visibility, which is how an anonymous visitor could read every enquiry — and
      # assertion 17 cannot see it, because the policy does mention the tenant.
      - name: Prove the public listing surface stays narrow
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            DROP POLICY listings_public_read ON listings;
            CREATE POLICY listings_public_read ON listings
              USING (tenant_id = current_tenant_id() OR is_platform_session()
                     OR is_delegated_unit(tenant_id, property_id, unit_id, unit_parent_id, 'property.read')
                     OR true)
              WITH CHECK (tenant_id = current_tenant_id() OR is_platform_session());"
          if go test -count=1 -run TestAnAnonymousVisitorSeesPublishedListingsAndNothingElse \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::an unpublished listing was publicly visible — a draft would be advertised before its owner published it"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # The leak this ADR actually caused. A policy that mentions the tenant *and*
          # reaches listings through a subquery is world-readable, and looks correct.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            DROP POLICY enquiries_tenant_isolation ON enquiries;
            CREATE POLICY enquiries_tenant_isolation ON enquiries
              USING (tenant_id = current_tenant_id() OR is_platform_session()
                     OR EXISTS (SELECT 1 FROM listings l WHERE l.id = listing_id))
              WITH CHECK (tenant_id = current_tenant_id() OR is_platform_session());"
          if go test -count=1 -run TestAnAnonymousVisitorSeesNothingButListings \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::an anonymous visitor read enquiries through a subquery to the public listings table"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE OR REPLACE FUNCTION enquiries_need_a_verified_prospect() RETURNS trigger
              LANGUAGE plpgsql AS \$\$ BEGIN RETURN NEW; END \$\$"
          if go test -count=1 -run TestAnEnquiryNeedsAVerifiedProspect \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::an unverified prospect booked an inspection — the only wall in the funnel is gone"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "the listing surface caught all three, as it should"

      # ADR-0021. The two halves hold each other up, so both are planted: a demo that can
      # reach a real provider would hold real money, and a sandbox that cannot be purged
      # grows forever. Neither failure announces itself.
      - name: Prove the sandbox rules still bite
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE OR REPLACE FUNCTION payments_sandbox_has_no_real_provider() RETURNS trigger
              LANGUAGE plpgsql AS \$\$ BEGIN RETURN NEW; END \$\$"
          if go test -count=1 -run TestASandboxCannotReachARealProvider \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::a demo created a payment against a real provider, so the sandbox is no longer safe to delete"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # The purge widened to a real organisation. This is the dangerous direction: it
          # reads as a simplification and it makes the cleanup job able to delete a
          # financial record.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE OR REPLACE FUNCTION sandbox_purge_permitted(row_tenant uuid) RETURNS boolean
              LANGUAGE sql STABLE PARALLEL SAFE AS
              \$\$ SELECT row_tenant IS NOT NULL AND is_purge_session() \$\$"
          if go test -count=1 -run TestOnlyThePurgeJobCanDeleteAndOnlyFromASandbox \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::the purge deleted a real organisation's data — the sandbox exception is not scoped to sandboxes"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "DROP TRIGGER demo_sessions_sandbox_only ON demo_sessions"
          if go test -count=1 -run TestADemoSessionCannotPointAtARealOrganisation \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::a demo session pointed at a real organisation, so an unauthenticated token reaches real data"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "the sandbox rules caught all three, as they should"

      # Assertion 16, ADR-0021 §4. The failure is invisible from the table that causes it:
      # it shows up months later as a sandbox that cannot be cleaned up.
      - name: Prove the sandbox purge stays possible
        env:
          PGPASSWORD: ci
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            DROP POLICY properties_no_delete ON properties;
            CREATE POLICY properties_no_delete ON properties AS RESTRICTIVE FOR DELETE USING (false)"
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 16 accepted a table an expired sandbox could never be purged from"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "the assertion caught it, as it should"

      # ADR-0001's dependency direction, which nothing enforced until ADR-0008 wanted
      # money.Minor for a rent amount in a platform package. That reads as harmless
      # and inverts the arrow.
      - name: Prove platform cannot depend on a module
        run: |
          set -uo pipefail
          trap 'rm -f internal/platform/effective/planted_dep.go' EXIT
          printf 'package effective\n\nimport _ "github.com/tesserix/dwellm8/services/api/internal/money/domain"\n' \
            > internal/platform/effective/planted_dep.go
          if go test -count=1 -run TestPlatformDoesNotImportAModule ./internal/platform/arch/; then
            echo "::error::a platform package imported a module and the guard passed"
            exit 1
          fi
          echo "the guard caught it, as it should"

      # ADR-0015 §4. The rule this whole standard turns on: a run that passed the
      # point of no return cannot have been compensated, because nothing after an
      # irreversible step can be undone. Recording it as compensated says the world
      # was put back after money left, and every report downstream believes it.
      #
      # Two plants. Dropping the constraint is the obvious one. Neutering the
      # monotonic flag is the subtle one — it leaves the constraint in place and
      # lets it be satisfied by editing the evidence rather than by the world being
      # reversible, which is the version that would pass review.
      - name: Prove a compensation cannot be claimed after the money left
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE workflow_runs DROP CONSTRAINT workflow_runs_compensated_means_reversible"
          if go test -count=1 -run TestARunPastThePointOfNoReturnCannotBeRecordedAsCompensated \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::a run past the point of no return was recorded as compensated"
            exit 1
          fi

          # The planted test committed the row the constraint forbids, which is the
          # point — and it means the schema cannot simply be replayed to restore the
          # constraint, because ADD CONSTRAINT validates existing rows. The file warns
          # rather than aborting (see its "load-bearing rules" block) and assertion 13
          # then fails, correctly. So the row this step caused is removed first.
          #
          # As the superuser, because both locks that protect these rows are working:
          # DELETE is revoked from dwellm8_app and a RESTRICTIVE policy refuses it, so
          # the bootstrap role cannot clear its own test data. That is the right
          # trade for a production table and it makes a CI fixture need a bigger hammer.
          PGPASSWORD=bootstrap psql -h localhost -U postgres -d dwellm8 -v ON_ERROR_STOP=1 -c "
            ALTER TABLE workflow_runs NO FORCE ROW LEVEL SECURITY;
            DELETE FROM workflow_steps;
            DELETE FROM workflow_runs;
            ALTER TABLE workflow_runs FORCE ROW LEVEL SECURITY;" >/dev/null
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE OR REPLACE FUNCTION workflow_runs_forward_only() RETURNS trigger
              LANGUAGE plpgsql AS \$\$
              BEGIN
                IF NOT workflow_transition_allowed(OLD.state, NEW.state) THEN
                  RAISE EXCEPTION 'no' USING ERRCODE = 'check_violation';
                END IF;
                NEW.updated_at := now(); RETURN NEW;
              END \$\$"
          if go test -count=1 -run TestThePointOfNoReturnCannotBeUnpassed \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::the point of no return was cleared, so the compensation constraint can be satisfied by editing the evidence"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "the rule caught both, as it should"

      # ADR-0015 §1 and §3. Two guards that prevent different failures, and neither
      # has an error in it when it is violated: an SDK import that drags a cluster
      # into a domain test, and a wall-clock read that makes a replayed workflow
      # take a branch it did not take the first time.
      - name: Prove the workflow determinism guards still bite
        run: |
          set -uo pipefail
          trap 'rm -f internal/money/domain/planted_sdk.go internal/platform/workflow/planted_clock.go' EXIT

          printf 'package domain\n\nimport _ "go.temporal.io/sdk/workflow"\n' \
            > internal/money/domain/planted_sdk.go
          if go test -count=1 -run TestTheTemporalSDKIsConfinedToOneAdapter ./internal/platform/arch/; then
            echo "::error::the Temporal SDK was imported into internal/money/domain and the guard passed"
            exit 1
          fi
          rm -f internal/money/domain/planted_sdk.go

          cat > internal/platform/workflow/planted_clock.go <<'GO'
          package workflow

          import "time"

          func plantedDeadline() time.Time { return time.Now().Add(time.Hour) }
          GO
          if go test -count=1 -run TestNothingInAWorkflowReadsAClockOrRollsADie ./internal/platform/arch/; then
            echo "::error::a wall-clock read in the workflow package passed the determinism guard"
            exit 1
          fi
          rm -f internal/platform/workflow/planted_clock.go
          echo "both guards caught it, as they should"

      # ADR-0012 §8, and the one guard in this file that plants a defect nobody
      # would call a defect. The trigger only recomputes two counters and refuses
      # one state; removing it leaves every test that writes a run passing, every
      # log line clean, and a day with three missing payments recorded as
      # reconciled — because the job that reconciles the day is the job that
      # reports on it, and its own report was never evidence.
      - name: Prove a day cannot be called reconciled while money is missing
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE OR REPLACE FUNCTION reconciliation_run_counters() RETURNS trigger
              LANGUAGE plpgsql AS \$\$ BEGIN RETURN NEW; END \$\$"
          if go test -count=1 -run TestADayCannotBeCalledReconciledWhileDriftIsOpen \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::a day with three open drift rows was called reconciled with the trigger removed"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "the trigger caught it, as it should"

      # ADR-0012 §7. The other direction of the same lesson ADR-0011 §3 taught:
      # two copies of a rule will differ once. Here the rule is the ageing
      # boundary, and the version that differs quietly is a report that buckets a
      # four-day-old item differently from the alert that fired on it.
      #
      # Two defects, because they fail differently. The first moves a boundary in
      # the function both copies are compared through. The second leaves the
      # function alone and gives the view its own inline CASE — which is what
      # somebody "simplifying away a one-line function" would do, and which no
      # comparison of the function against Go can catch.
      - name: Prove the ageing boundary drift check still bites
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE OR REPLACE FUNCTION settlement_age_bucket(age interval)
              RETURNS text LANGUAGE sql IMMUTABLE PARALLEL SAFE AS \$\$
              SELECT CASE
                         WHEN age <  interval '1 day'   THEN 'same_day'
                         WHEN age <= interval '2 days'  THEN '1_3_days'
                         WHEN age <= interval '7 days'  THEN '4_7_days'
                         WHEN age <= interval '30 days' THEN '8_30_days'
                         ELSE 'over_30_days'
                     END \$\$"
          if go test -count=1 -run TestTheAgeingBucketsMatchTheDatabase ./internal/money/store/; then
            echo "::error::the ageing contract passed with the 3-day boundary moved to 2 days"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE OR REPLACE VIEW settlement_drift_ageing WITH (security_invoker = true) AS
              SELECT d.provider, d.tenant_id, d.drift_kind, d.state,
                     CASE WHEN now() - d.since < interval '1 day' THEN 'same_day'
                          ELSE 'over_30_days' END AS age_bucket,
                     count(*) AS item_count, sum(d.amount_minor) AS amount_minor,
                     min(d.since) AS oldest_since
                FROM settlement_drift d
               GROUP BY d.provider, d.tenant_id, d.drift_kind, d.state, 5"
          if go test -count=1 -run TestTheAgeingBucketsMatchTheDatabase ./internal/money/store/; then
            echo "::error::the ageing contract passed with the view carrying its own inline boundaries"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "the drift check caught both, as it should"

      # ADR-0011 §3. The payment state machine exists in Go and in PostgreSQL,
      # and the dangerous direction of drift is the quiet one: the schema
      # refusing a transition Go performs, so a payment stops advancing while
      # every log line says the webhook was handled. Dropping the self-transition
      # is the specific mistake somebody tidying the function up would make — it
      # looks redundant and it is what makes a redelivered webhook a no-op.
      - name: Prove the payment state machine drift check still bites
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE OR REPLACE FUNCTION payment_transition_allowed(from_status text, to_status text)
              RETURNS boolean LANGUAGE sql IMMUTABLE PARALLEL SAFE AS \$\$
              SELECT (from_status, to_status) IN
                (('created','attempted'), ('attempted','captured'), ('captured','settled')) \$\$"
          if go test -count=1 -run TestTheGoStateMachineMatchesTheDatabase ./internal/money/store/; then
            echo "::error::the drift check passed with the self-transition removed from the schema"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "the drift check caught it, as it should"

      # ADR-0007 §6. The float guard is the one check whose whole value is that
      # it fails, and the failure it prevents — a percentage computed in float64
      # — looks entirely reasonable in review. So a real float is planted in the
      # money module and the build is expected to go red naming the line.
      - name: Prove the money float guard still bites
        run: |
          set -uo pipefail
          trap 'rm -f internal/money/domain/planted_float.go' EXIT
          cat > internal/money/domain/planted_float.go <<'GO'
          package domain

          func plantedFee(amount Minor) Minor { return Minor(float64(amount) * 0.0299) }
          GO
          if go test -count=1 -run TestNoFloatInAMoneyPath ./internal/platform/arch/; then
            echo "::error::the float guard passed with a float64 percentage in internal/money/domain"
            exit 1
          fi
          echo "the float guard caught it, as it should"

      # ADR-0022. Two plants, because the mandate lifecycle has two ways of being
      # wrong and only one of them looks wrong. Dropping the resume is the subtle
      # one: it makes the mandate machine forward-only, which reads as consistency
      # with ADR-0011 and quietly forces every tenant coming off a payment holiday
      # to re-authorise an authority nobody revoked.
      - name: Prove the mandate lifecycle still bites
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE OR REPLACE FUNCTION mandate_transition_allowed(from_status text, to_status text)
              RETURNS boolean LANGUAGE sql IMMUTABLE PARALLEL SAFE AS \$\$
              SELECT (from_status, to_status) IN (
                ('created','pending'), ('created','rejected'), ('created','expired'),
                ('created','revoked'), ('pending','active'), ('pending','rejected'),
                ('pending','expired'), ('pending','revoked'), ('active','paused'),
                ('active','revoked'), ('active','expired'), ('paused','revoked'),
                ('paused','expired')) \$\$"
          if go test -count=1 -run 'TestTheGoMandateMachineMatchesTheDatabase|TestTheDatabaseAllowsAnAuthorityToResume' \
              ./internal/money/store/; then
            echo "::error::the drift check passed with the self-transition and the resume removed"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "the drift check caught it, as it should"

      # The index is the only thing standing between a tenant and being debited
      # twice on the first of the month. Both authorities are real and both were
      # authorised by somebody, so nothing else in the system reads as wrong.
      - name: Prove a unit cannot hold two live authorities
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "DROP INDEX mandates_one_active_per_unit_idx"
          if go test -count=1 -run 'TestAUnitHasAtMostOneLiveAuthority|TestTheMandateIndexesThatAreRules' \
              ./internal/platform/tenancy/isolationtest/ ./internal/money/store/; then
            echo "::error::two active mandates were registered on one unit"
            exit 1
          fi

          # The planted test committed the second authority — that is what it was
          # proving — so the index cannot simply be rebuilt by replaying the schema:
          # CREATE UNIQUE INDEX validates the rows already there and fails on the
          # duplicate this step deliberately caused. Same shape as the compensation
          # guard above, and the same bigger hammer for the same good reason: DELETE
          # on mandates is refused by a RESTRICTIVE policy, because a revoked
          # authority is exactly what a disputed debit needs the record to disprove.
          PGPASSWORD=bootstrap psql -h localhost -U postgres -d dwellm8 -v ON_ERROR_STOP=1 -c "
            ALTER TABLE mandates NO FORCE ROW LEVEL SECURITY;
            DELETE FROM mandates;
            ALTER TABLE mandates FORCE ROW LEVEL SECURITY;" >/dev/null
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null
          echo "the index caught it, as it should"

      # ADR-0022 §3. The bug that only ever appears against real traffic: a handler
      # that decodes the body before verifying it. Every provider signs raw bytes,
      # and a test that builds the body itself never notices.
      - name: Prove webhook verification is over raw bytes
        run: |
          set -uo pipefail
          # Restored from a copy rather than with git checkout, so the step is safe
          # to run against a working tree that has uncommitted changes in it.
          cp internal/money/provider/provider.go /tmp/provider.go.orig
          trap 'cp /tmp/provider.go.orig internal/money/provider/provider.go' EXIT
          python3 - <<'PLANT'
          p = 'internal/money/provider/provider.go'
          s = open(p).read()
          s = s.replace('signed := append([]byte(w.Timestamp), w.Body...)',
                        'var reparsed any\n\t_ = json.Unmarshal(w.Body, &reparsed)\n\tnormalised, _ := json.Marshal(reparsed)\n\tsigned := append([]byte(w.Timestamp), normalised...)')
          s = s.replace('"encoding/hex"', '"encoding/hex"\n\t"encoding/json"')
          open(p, 'w').write(s)
          PLANT
          if go test -count=1 -run TestVerificationIsOverRawBytesAndNotReMarshalledJSON \
              ./internal/money/provider/; then
            echo "::error::verification passed over a re-marshalled body, so a decoding handler would look correct"
            exit 1
          fi
          echo "the raw-bytes test caught it, as it should"

      # ADR-0023. Four plants, and the third is the one this table exists for: a
      # rate that can be written at runtime is a rate with no citation and no
      # review, and nothing about the resulting invoice looks wrong.
      - name: Prove the statutory registry still bites
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail
          awk '/^-- tenancy assertions/{f=1} f' /tmp/dwellm8.sql > /tmp/assertions.sql

          # The registry answers as-of, so a rule with no end date resolves for
          # every later date too. Ending the old 194-I threshold on the day the
          # Finance Act 2025 raised it is what makes March reproduce; removing that
          # bound makes the two rows overlap and the answer depend on which sorted
          # first. The exclusion constraint refuses it — so the constraint goes
          # first, which is the defect this is really about.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            ALTER TABLE statutory_rules DROP CONSTRAINT statutory_rules_no_overlap;
            UPDATE statutory_rules SET valid_to = NULL
             WHERE rule_key = 'tds.194i_annual' AND valid_from = DATE '2020-04-01';" >/dev/null
          if go test -count=1 -run TestTheThresholdInForceIsTheOneOnTheDate \
              ./internal/platform/statutory/store/; then
            echo "::error::two thresholds were live on the same day and the registry still answered"
            exit 1
          fi
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 13 accepted a registry with no exclusion constraint"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            UPDATE statutory_rules SET valid_to = DATE '2025-04-01'
             WHERE rule_key = 'tds.194i_annual' AND valid_from = DATE '2020-04-01';" >/dev/null
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # A rate the application can write. The GRANT is plausible — it is what a
          # blanket "GRANT ALL ON ALL TABLES" does — and it is why assertion 18
          # asserts the privilege rather than trusting the REVOKE three sections up.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "GRANT INSERT ON statutory_rules TO dwellm8_app" >/dev/null
          if go test -count=1 -run TestARequestCannotWriteARule ./internal/platform/statutory/store/; then
            echo "::error::a request wrote a statutory rule — an organisation can now decide its own tax rate"
            exit 1
          fi
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 18 accepted a runtime-writable rule table"
            exit 1
          fi
          # The planted test's insert succeeded, which is the point. The row is this
          # step's own and goes before the registry is read again.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "DELETE FROM statutory_rules WHERE rule_key = 'tds.mine'" >/dev/null
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # An unverified rule set to block. The CHECK refuses it, so the plant has
          # to remove the CHECK — which is exactly the case assertion 18's second
          # clause exists for: a CHECK inside CREATE TABLE IF NOT EXISTS never
          # reaches a database that already has the table.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            ALTER TABLE statutory_rules DROP CONSTRAINT statutory_rules_unverified_cannot_block;
            UPDATE statutory_rules SET enforcement = 'block'
             WHERE jurisdiction = 'KA' AND verification_status = 'unverified';" >/dev/null
          if psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/assertions.sql; then
            echo "::error::assertion 18 accepted an unverified rule set to block — a cap enforced from a blog post"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            UPDATE statutory_rules SET enforcement = 'record_only'
             WHERE jurisdiction = 'KA' AND verification_status = 'unverified';" >/dev/null
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # And the review report, which is the only guard here that fires on time
          # rather than on a defect. The seed's review dates are months out, so the
          # report is legitimately empty — which means an empty report proves
          # nothing until a row is actually due.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            UPDATE statutory_rules SET review_due = current_date - 10
             WHERE rule_key = 'tds.194ib_monthly';" >/dev/null
          overdue=$(psql -h localhost -U dwellm8 -d dwellm8 -Atc \
            "SELECT count(*) FROM statutory_rules_review_due WHERE days_overdue >= 10")
          if [ "$overdue" != "1" ]; then
            echo "::error::a rule ten days past its review date is not in the review report ($overdue rows)"
            exit 1
          fi
          if ! go test -count=1 -run TestTheReviewReportAgreesWithTheRegistry \
              ./internal/platform/statutory/store/; then
            echo "::error::the registry and the review view disagree about what is due"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            UPDATE statutory_rules SET review_due = DATE '2026-10-31'
             WHERE rule_key = 'tds.194ib_monthly';" >/dev/null
          echo "the registry caught all four, as it should"

      # ADR-0024. Three plants, and none of them announces itself: a tenancy that
      # starts with no TDS section computes nothing and looks healthy for nine
      # months, and the third — a guard that fires immediately instead of at commit
      # — is the version of this trigger that passes its own test and refuses every
      # real write, because the facts carry a foreign key to the lease they are
      # written with.
      - name: Prove the TDS decision matrix still bites
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail

          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            CREATE OR REPLACE FUNCTION leases_tax_path_is_known() RETURNS trigger
              LANGUAGE plpgsql AS \$\$ BEGIN RETURN NULL; END \$\$"
          if go test -count=1 -run TestATenancyCannotStartWithNoTaxPath \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::a tenancy started with no TDS section governing it — every payment under it is a deduction nobody computed"
            exit 1
          fi
          if go test -count=1 -run TestASection195TenancyCannotStartUnacknowledged \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::a section 195 tenancy started unacknowledged — the tenant carries the liability and was never told"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # Two sets of facts true on one day: two sections govern the same payment,
          # and whichever row sorted first decides the rate.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE lease_tax_facts DROP CONSTRAINT lease_tax_facts_no_overlap"
          if go test -count=1 -run TestALeaseHasOneSetOfTaxFactsPerDay \
              ./internal/platform/tenancy/isolationtest/; then
            echo "::error::a lease held two sets of tax facts on the same day"
            exit 1
          fi
          # The overlapping rows that plant wrote have to go before the constraint can
          # come back. Otherwise ADD CONSTRAINT refuses them — correctly — and the
          # replay stops there, leaving every later plant restored against a schema
          # that was never rebuilt.
          PGPASSWORD=bootstrap psql -h localhost -U postgres -d dwellm8 -v ON_ERROR_STOP=1 -c "
            ALTER TABLE lease_tax_facts NO FORCE ROW LEVEL SECURITY;
            DELETE FROM lease_tax_facts;
            ALTER TABLE lease_tax_facts FORCE ROW LEVEL SECURITY;" >/dev/null
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # The plant that looks like a tidy-up. An immediate trigger enforces the
          # same rule and refuses every legitimate write, because the facts cannot
          # exist before the lease they reference.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -c "
            DROP TRIGGER leases_tax_path_known ON leases;
            CREATE TRIGGER leases_tax_path_known
              AFTER INSERT OR UPDATE ON leases
              FOR EACH ROW EXECUTE FUNCTION leases_tax_path_is_known();"
          if go test -count=1 -run TestTheTaxPathGuardIsDeferredToCommit ./internal/lease/store/; then
            echo "::error::the tax path guard is no longer deferred, so no lease can be written with its own facts"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # And the Go half: the matrix must not invent a section 195 rate.
          if ! go test -count=1 -run TestANonResidentLandlordPutsEveryDeductorOnSection195 \
              ./internal/platform/statutory/tds/; then
            echo "::error::section 195 resolved to a rate nobody chose"
            exit 1
          fi
          echo "the matrix caught all three, as it should"

      # ADR-0025. The overrides fail in the direction nobody audits: a deduction
      # that is too small looks like an ordinary one, and the tenant finds out
      # from the assessing officer. Both plants remove a floor rather than break
      # a test, so both leave a service that runs and computes the wrong number.
      - name: Prove the payee-level rate overrides still bite
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail

          # A certificate that never expires. It would go on lowering a deduction
          # for years after the officer's determination lapsed, and the row would
          # look exactly like a correct low rate.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE tds_certificates ALTER COLUMN valid_to DROP NOT NULL"
          if go test -count=1 -run TestACertificateCannotBeOpenEnded \
              ./internal/platform/statutory/tds/store/; then
            echo "::error::a section 197 certificate can now be open-ended"
            exit 1
          fi
          # Restored by hand, not by the replay: CREATE TABLE IF NOT EXISTS skips a
          # table that already exists, so the schema file cannot repair a column
          # somebody altered. Every other plant here changes something the file
          # re-creates — a function, a constraint, a policy — and this one does not.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE tds_certificates ALTER COLUMN valid_to SET NOT NULL"

          # Two live certificates for one landlord and section: two rates for one
          # deduction, and whichever sorted first wins.
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE tds_certificates DROP CONSTRAINT tds_certificates_no_overlap"
          if go test -count=1 -run TestOneLiveCertificatePerPayeePerSection \
              ./internal/platform/statutory/tds/store/; then
            echo "::error::a landlord can hold two live certificates for one section"
            exit 1
          fi
          psql -h localhost -U dwellm8 -d dwellm8 -v ON_ERROR_STOP=1 -f /tmp/dwellm8.sql >/dev/null

          # And the Go half, which needs no database: the zero profile must deduct
          # at the section 206AA floor, and section 206AB must stay dead after the
          # date it was omitted.
          if ! go test -count=1 -run 'TestNoPANDeductsAtTheSection206AAFloor|TestSection206ABAppliesOnlyWhileItExisted|TestTheSection206AAFloorDoesNotRescueAMissingSectionRate' \
              ./internal/platform/statutory/tds/; then
            echo "::error::the payee-level floors no longer hold"
            exit 1
          fi
          echo "the overrides caught both, as they should"

      # ADR-0026. Two plants, and the second is the one that was true for months
      # before this ADR: a NOT NULL consent_artefact_id referencing a table that
      # did not exist, so every verification cited consent nobody could produce.
      - name: Prove the DPDP posture still bites
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail

          # The retention matrix, bent in the document only. The periods exist in
          # docs/data-retention.md for a reviewer and in Go for an erasure answer,
          # and the drift that matters is the quiet one — the document amended
          # after a review, the code left behind, every answer citing a period
          # nobody agreed to.
          # ../../docs, because this job's working directory is services/api.
          cp ../../docs/data-retention.md /tmp/data-retention.md
          sed -i 's/| `kyc` | \*\*5\*\* |/| `kyc` | **7** |/' ../../docs/data-retention.md
          if go test -count=1 -run TestTheDocumentedMatrixMatchesTheCode \
              ./internal/platform/dpdp/; then
            echo "::error::the retention matrix drifted from its own documentation and nothing noticed"
            cp /tmp/data-retention.md ../../docs/data-retention.md
            exit 1
          fi
          cp /tmp/data-retention.md ../../docs/data-retention.md

          # A KYC verification citing a consent artefact that does not exist. Not a
          # planted defect — dropping the foreign key is what *permits* this, so
          # the check is the assertion itself: with the key in place the insert
          # must be refused, and refused by the key rather than by row-level
          # security, which would pass for the wrong reason.
          out=$(psql -h localhost -U dwellm8 -d dwellm8 -c "
              SET app.tenant_id = '11111111-1111-1111-1111-111111111111';
              INSERT INTO kyc_verifications (tenant_id, subject_party_id, kind, masked_reference,
                                             result, provider, provider_txn_id, consent_artefact_id)
              VALUES ('11111111-1111-1111-1111-111111111111', gen_random_uuid(), 'pan',
                      'XXXXXX234F', 'verified', 'nsdl', 'plant', gen_random_uuid())" 2>&1) && {
            echo "::error::a verification was recorded citing consent that does not exist"
            psql -h localhost -U dwellm8 -d dwellm8 -c "DELETE FROM kyc_verifications WHERE provider_txn_id = 'plant'" >/dev/null
            exit 1
          }
          if ! echo "$out" | grep -q "kyc_verifications_consent_fkey"; then
            echo "::error::the insert was refused, but not by the consent foreign key: $out"
            exit 1
          fi
          echo "the posture caught both, as it should"

      # Issue #226. The audit is written inside the same transaction as the work,
      # and both plants attack that: one records an action that was rolled back,
      # the other lets a handler take the path that names nobody.
      - name: Prove a support action cannot happen unaudited
        env:
          PGPASSWORD: ci
          TEST_DATABASE_URL: postgres://dwellm8_api:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PLATFORM_DATABASE_URL: postgres://dwellm8_platform:ci@localhost:5432/dwellm8?sslmode=disable
          TEST_PURGE_DATABASE_URL: postgres://dwellm8_purge:ci@localhost:5432/dwellm8?sslmode=disable
        run: |
          set -uo pipefail

          # A handler on the unaudited path. The file is removed either way — see
          # the .gitignore note about planted_* escaping once already.
          mkdir -p internal/money/http
          printf 'package http\n\n// planted: tenancy.Platform(\n' > internal/money/http/planted_platform.go
          if go test -count=1 -run TestNoHandlerTakesTheUnauditedPlatformPath ./internal/platform/arch/; then
            rm -f internal/money/http/planted_platform.go
            echo "::error::a handler can take the privileged path without naming who, to what or why"
            exit 1
          fi
          rm -f internal/money/http/planted_platform.go

          # The audit written outside the transaction, which is the version that
          # records actions the database rolled back.
          cp internal/platform/tenancy/support.go /tmp/support.go
          python3 - <<'"'"'PLANT'"'"'
          import pathlib
          p = pathlib.Path("internal/platform/tenancy/support.go")
          s = p.read_text()
          s = s.replace("if err := fn(ctx, tx); err != nil {\n\t\treturn err\n\t}",
                        "if err := fn(ctx, tx); err != nil {\n\t\t_ = tx.Commit(ctx)\n\t\treturn err\n\t}")
          p.write_text(s)
          PLANT
          if go test -count=1 -run TestAnActionThatFailsLeavesNoAuditRow \
              ./internal/platform/tenancy/isolationtest/; then
            cp /tmp/support.go internal/platform/tenancy/support.go
            echo "::error::an audit row survived an action that was rolled back"
            exit 1
          fi
          cp /tmp/support.go internal/platform/tenancy/support.go
          echo "the support path caught both, as it should"

          # Issue #228. The limiter is concurrent by definition, so it is the one
          # place in this service where -race is not optional.
          if ! go test -count=1 -race ./internal/platform/httpx/; then
            echo "::error::the rate limiter does not hold under -race"
            exit 1
          fi

      - name: Build
        run: go build ./...

      # Known vulnerabilities in what is actually reachable, not in what happens
      # to be in go.sum. govulncheck traces call paths, so a CVE in a dependency
      # this service never calls does not stop a deploy — which is what keeps the
      # gate believable enough to be acted on when it does fire.
      - name: Known vulnerabilities
        run: |
          # Pinned, like every other tool this workflow installs: @latest means
          # the gate itself changes without review, and a scanner that changed
          # under you is a scanner whose result you cannot compare to yesterday's.
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  image:
    needs: test
    # Manual dispatch builds an image too — otherwise re-running a build by hand
    # silently produces nothing, which is how you wait an hour for a tag that
    # was never going to exist.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built and loaded locally first, so the scan below happens *before*
      # anything is published. Scanning a pushed image tells you what you have
      # already given everyone else; the second build is a cache hit.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: services/api
          load: true
          build-args: VERSION=${{ github.sha }}
          tags: dwellm8-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: dwellm8-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          # Unfixed findings are not actionable in this build — there is no
          # version to move to — and failing on them would train everybody to
          # ignore the gate. They are still reported, just not fatal.
          ignore-unfixed: true
          exit-code: '1'

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: services/api
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/tesserix/dwellm8/dwellm8-api:main-${{ github.sha }}
            ghcr.io/tesserix/dwellm8/dwellm8-api:latest
          cache-from: type=gha
