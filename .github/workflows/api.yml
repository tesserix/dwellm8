name: api

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'services/api/**'
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: services/api/go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Includes internal/platform/arch — the ADR-0001 boundary tests. A module
      # reaching into another module's store fails the build here.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/api
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/tesserix/dwellm8/dwellm8-api:main-${{ github.sha }}
            ghcr.io/tesserix/dwellm8/dwellm8-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
